# Render blueprint for AI Battle — an always-on backend + managed Postgres.
#
# This declares the persistent backend we chose: one long-running Node web
# service (the Next.js site today; the API + match runner later) wired to a
# durable Postgres database. Deploy by pointing Render at this repo
# ("New + > Blueprint") — Render reads this file and provisions everything.
#
# Railway alternative: see docs/HOSTING.md (same shape, configured in the
# dashboard rather than a blueprint file).

services:
  - type: web
    name: ai-battle-web
    runtime: node
    # Free web services sleep after ~15 min idle (cold starts on next request).
    # Switch to `starter` for a genuinely always-on, never-sleeping process.
    plan: free
    autoDeploy: true
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter web build
    startCommand: pnpm --filter web start
    envVars:
      # Durable connection string, injected from the managed database below.
      - key: DATABASE_URL
        fromDatabase:
          name: ai-battle-db
          property: connectionString
      # Model provider keys — set the ones you use in the Render dashboard.
      # (sync: false keeps secrets out of this file / git.)
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

databases:
  # The persistent layer. Note: the free Postgres plan is removed after ~30
  # days — move to a paid plan (or Neon) before relying on it in production.
  - name: ai-battle-db
    plan: free
